[project]
name = "scrub"
version = "0.1.0"
description = "Regex scrubber for file contents and git history."
readme = "README-scrub.md"
requires-python = ">=3.10"
dependencies = [
    "git-filter-repo>=2.38",
]

[project.scripts]
scrub = "scrub.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/scrub"]
