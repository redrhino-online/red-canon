site_name: Red Canon
site_description: Internal resource for the framework and the RED Method.
docs_dir: docs
site_dir: site

theme:
  name: material
  features:
    - navigation.top
    - navigation.instant
    - search.suggest
    - search.highlight
    - content.code.copy
  palette:
    scheme: slate
    primary: red
    accent: red

nav:
  - Home: index.md
  - The method:
      - The big idea: method/big-idea.md
      - The method map: method/motions.md
      - Refine Offer: method/refine-offer.md
      - Engage Opportunity: method/engage-opportunity.md
      - Develop Audience: method/develop-audience.md
      - Results: method/results.md
  - Glossary: glossary.md

markdown_extensions:
  - admonition
  - attr_list
  - def_list
  - footnotes
  - tables
  - toc:
      permalink: true
  - pymdownx.details
  - pymdownx.highlight
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
