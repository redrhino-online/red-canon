site_name: The RED Method
site_description: How we turn expert knowledge into a product using the RED Method.
docs_dir: docs
site_dir: site

theme:
  name: material
  features:
    - navigation.top
    - navigation.instant
    - search.suggest
    - search.highlight
    - content.code.copy
  palette:
